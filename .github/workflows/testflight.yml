# Archives a signed Release build and uploads it straight to TestFlight.
#
# Trigger it by hand (Actions -> TestFlight -> Run workflow) or by pushing a v* tag.
# Not on every push: uploads use build minutes and clutter TestFlight.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID       Key ID of an App Store Connect API key (Users and Access -> Integrations).
#                    The key needs the **Admin** role — App Manager/Developer keys can't use
#                    cloud-managed distribution certificates, and export fails with
#                    "Cloud signing permission error / No profiles were found".
#   ASC_ISSUER_ID    Issuer ID shown above the key list
#   ASC_PRIVATE_KEY  Full contents of AuthKey_XXXXXX.p8, BEGIN/END lines included
#   APPLE_TEAM_ID    Team ID of the account that owns com.kamranzaidi.pocketledger
#
# The key and team must belong to the developer account that owns the live app, its bundle id
# and the iCloud container iCloud.com.kamranzaidi.pocketledger.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank = run number + 10, continuing after build 10)"
        required: false
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode on the runner
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          version_output=$(xcodebuild -version)
          echo "$version_output"
          major=$(printf '%s\n' "$version_output" | awk 'NR==1 {print $2}' | cut -d. -f1)
          if [ "$major" -lt 26 ]; then
            echo "::error::App Store uploads need Xcode 26+; this runner has Xcode $major. Pin a newer image, e.g. runs-on: macos-26"
            exit 1
          fi

      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Work out the build number
        id: build
        env:
          REQUESTED: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # The project was at build 10 when CI took over; builds only have to increase
          # within a version, so continue from there.
          if [ -n "${REQUESTED:-}" ]; then
            BUILD="$REQUESTED"
          else
            BUILD=$(( RUN_NUMBER + 10 ))
          fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Uploading as build $BUILD"

      # The archive is signed ad hoc ("-"), which embeds the app's entitlements without
      # needing any certificate; export then re-signs it with the cloud-managed distribution
      # certificate. Automatic signing would instead create an Apple Development
      # certificate on every fresh runner until the account hits Apple's limit
      # ("Choose a certificate to revoke").
      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "Pocket Ledger.xcodeproj" \
            -scheme "MyMoney Tracker" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketLedger.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.build }} \
            2>&1 | tee archive.log
          echo "Archived entitlements:"
          codesign -d --entitlements - --xml "$RUNNER_TEMP/PocketLedger.xcarchive/Products/Applications/Pocket Ledger.app" | plutil -p -

      - name: Export (distribution signing)
        env:
          EXPORT_OPTIONS: ${{ runner.temp }}/ExportOptions.plist
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, pathlib
          opts = {
              "method": "app-store-connect",
              "destination": "export",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "automatic",
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }
          pathlib.Path(os.environ["EXPORT_OPTIONS"]).write_bytes(plistlib.dumps(opts))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PocketLedger.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log

      # Refuse to upload a build that lost iCloud or push — sync and group sharing
      # would silently stop working for everyone who installs it.
      - name: Verify the signed app's entitlements
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/export"
          ipa=$(ls *.ipa)
          unzip -q "$ipa" -d unpacked
          app=$(ls -d unpacked/Payload/*.app)
          codesign -d --entitlements - --xml "$app" > ent.plist
          plutil -p ent.plist
          value() { plutil -extract "$1" raw -o - ent.plist 2>/dev/null || echo "<missing>"; }
          [ "$(value com.apple.developer.icloud-container-identifiers.0)" = "iCloud.com.kamranzaidi.pocketledger" ] \
            || { echo "::error::iCloud container missing from the signed app"; exit 1; }
          [ "$(value com.apple.developer.icloud-services.0)" = "CloudKit" ] \
            || { echo "::error::CloudKit service missing from the signed app"; exit 1; }
          [ "$(value aps-environment)" = "production" ] \
            || { echo "::error::Push entitlement missing or not production"; exit 1; }
          [ "$(value get-task-allow)" = "false" ] \
            || { echo "::error::Debug-signed build"; exit 1; }
          echo "Entitlements OK"

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          # altool finds the key in ~/private_keys/AuthKey_<id>.p8, written above.
          xcrun altool --upload-app \
            -f "$(ls "$RUNNER_TEMP"/export/*.ipa)" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee upload.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            archive.log
            export.log
            upload.log
          retention-days: 14
          if-no-files-found: ignore
